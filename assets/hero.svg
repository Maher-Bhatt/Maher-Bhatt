.mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
.draw{stroke-dasharray:1;animation:draw 1.8s cubic-bezier(.65,0,.35,1) backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.fade{animation:fade 1.1s ease backwards}
@keyframes fade{from{opacity:0}}
.rise{animation:rise 1.2s cubic-bezier(.16,1,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

.orb{opacity:.13;animation:drift 32s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(50px,-30px)}100%{transform:translate(-40px,24px)}}
.name{animation:up 1.4s cubic-bezier(.16,1,.3,1) .35s backwards}
@keyframes up{from{transform:translateY(120px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s cubic-bezier(.16,1,.3,1) infinite}
@keyframes ping{from{transform:scale(1);opacity:.6}to{transform:scale(3.2);opacity:0}}
.rule{stroke-dasharray:1;animation:draw 1.6s cubic-bezier(.65,0,.35,1) 2.2s backwards}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
