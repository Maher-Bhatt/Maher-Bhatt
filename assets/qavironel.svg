<text x="56" y="178" font-size="25" font-weight="600" letter-spacing="-.6" fill="#EDEDEF">Ideas. <tspan fill="#EE5216">Engineered.</tspan></text>
<text x="56" y="226" font-size="16.5" fill="#8E8E98">An independent design and engineering studio in Vadodara.</text><text x="56" y="251" font-size="16.5" fill="#8E8E98">We build websites, digital products and practical AI tools</text><text x="56" y="276" font-size="16.5" fill="#8E8E98">for founders and teams in India, the US and Europe, and</text><text x="56" y="301" font-size="16.5" fill="#8E8E98">clients work directly with the people who build.</text>
