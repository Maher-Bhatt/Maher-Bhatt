<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="CampusLoop: A multi-university academic platform and community: verified syllabus notes, 1,180+ runnable lab practicals, a 3,027+ question bank, timed mocks and gamified study streaks.">
<style>
text{font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
.draw{stroke-dasharray:1;animation:draw 1.8s cubic-bezier(.65,0,.35,1) backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.fade{animation:fade 1.1s ease backwards}
@keyframes fade{from{opacity:0}}
.rise{animation:rise 1.2s cubic-bezier(.16,1,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

@keyframes feed{0%,18%{transform:translateY(0)}25%,43%{transform:translateY(-56px)}50%,68%{transform:translateY(-112px)}75%,93%{transform:translateY(-168px)}100%{transform:translateY(-224px)}}
.feed{animation:feed 10s cubic-bezier(.65,0,.35,1) infinite}
.ring{stroke-dasharray:276.5;stroke-dashoffset:60.8;animation:ring 10s cubic-bezier(.65,0,.35,1) infinite}
@keyframes ring{0%{stroke-dashoffset:276.5}60%,92%{stroke-dashoffset:60.8}100%{stroke-dashoffset:276.5}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
