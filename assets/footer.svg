<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Engineering honestly. Shipping consistently.">
<style>
text{font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
.draw{stroke-dasharray:1;animation:draw 1.8s cubic-bezier(.65,0,.35,1) backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.fade{animation:fade 1.1s ease backwards}
@keyframes fade{from{opacity:0}}
.rise{animation:rise 1.2s cubic-bezier(.16,1,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.pulse{animation:pulse 2.8s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1200" height="150" rx="20" fill="#09090B"/><rect x=".5" y=".5" width="1199" height="149" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<g transform="translate(582,18) scale(.28)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
<path d="M78 14 H50 L19 45 V75 L47 103 H75 L92 86 V55 L81 34" stroke="#8E8E98"/><path d="M69 71 L108 110" stroke="#EE5216"/></g>
<text x="600" y="82" text-anchor="middle" font-size="21" font-weight="600" letter-spacing="-.4" fill="#EDEDEF">Engineering honestly. <tspan fill="#8E8E98">Shipping consistently.</tspan></text><circle cx="537" cy="104" r="3.5" fill="#EE5216" class="pulse" style="animation-delay:0.00s"/><circle cx="555" cy="104" r="3.5" fill="#E9B949" class="pulse" style="animation-delay:0.12s"/><circle cx="573" cy="104" r="3.5" fill="#7FC8A0" class="pulse" style="animation-delay:0.24s"/><circle cx="591" cy="104" r="3.5" fill="#5BB8C4" class="pulse" style="animation-delay:0.36s"/><circle cx="609" cy="104" r="3.5" fill="#A99BF0" class="pulse" style="animation-delay:0.48s"/><circle cx="627" cy="104" r="3.5" fill="#7AA7F5" class="pulse" style="animation-delay:0.60s"/><circle cx="645" cy="104" r="3.5" fill="#E88A8A" class="pulse" style="animation-delay:0.72s"/><circle cx="663" cy="104" r="3.5" fill="#D2B48C" class="pulse" style="animation-delay:0.84s"/>
</svg>
