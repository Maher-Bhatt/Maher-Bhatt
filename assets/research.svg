xt x="600.0" y="95.0" text-anchor="middle" font-family="SFMono-Regular, ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#C4C4CB" letter-spacing="1">SOLVER</text><rect x="815" y="190" width="170" height="60" rx="12" fill="#101013" stroke="#3A3A42" stroke-width="1"/><text x="900.0" y="225.0" text-anchor="middle" font-family="SFMono-Regular, ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#C4C4CB" letter-spacing="1">CRITIC</text><rect x="515" y="320" width="170" height="60" rx="12" fill="#101013" stroke="#3A3A42" stroke-width="1"/><text x="600.0" y="355.0" text-anchor="middle" font-family="SFMono-Regular, ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#C4C4CB" letter-spacing="1">VERIFIER</text><circle cx="600" cy="220" r="60" fill="none" stroke="#3A3A42"><animate attributeName="r" values="58;66;58" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></circle><text x="600" y="216" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#ECECEE" letter-spacing="2">Δ &gt; baseline</text><text x="600" y="240" text-anchor="middle" font-family="SFMono-Regular, ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="3" fill="#8A8A93">TARGET: A FEW POINTS</text><text x="40" y="58" font-family="SFMono-Regular, ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="4" fill="#6B6B73">RESEARCH  /  MULTI-AGENT LLM SYSTEMS</text><rect x="880" y="36" width="280" height="30" rx="15" fill="none" stroke="#3A3A42"/><circle cx="896" cy="51" r="3" fill="#C9CCD1"><animate attributeName="opacity" values="1;0.25;1" dur="3.4s" repeatCount="indefinite"/></circle><text x="914" y="56" font-family="SFMono-Regular, ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#B5B5BC">STATUS: IN PROGRESS</text><text x="40" y="430" font-family="SFMono-Regular, ui-monospace, Menlo, Consolas, monospace" font-size